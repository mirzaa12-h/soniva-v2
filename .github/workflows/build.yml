name: Build Soniva APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ekstrak proyek
        run: unzip -q SonivaApp.zip

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Siapkan debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Siapkan AAR placeholder
        working-directory: SonivaApp
        run: |
          mkdir -p app/libs
          python3 -c "import zipfile; z=zipfile.ZipFile('app/libs/discord_partner_sdk.aar','w'); z.writestr('AndroidManifest.xml','<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"com.discord.sdk\"></manifest>'); z.close()"

      - name: Build APK
        working-directory: SonivaApp
        env:
          RYTHIM_APPLICATION_ID: com.soniva.app
          RYTHIM_APP_NAME: Soniva
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:assembleFossDebug -x lint --stacktrace

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: Soniva-APK
          path: SonivaApp/app/build/outputs/apk/**/*.apk
          retention-days: 30
